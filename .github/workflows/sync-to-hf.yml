name: Sync to Hugging Face Space

# Mirrors the default branch to a Hugging Face Static Space on every push, so
# the live demo tracks main. The Space builds the frontend (see the
# app_build_command in the README front matter) and serves frontend/dist.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   - Secret   HF_TOKEN     : a Hugging Face access token with write scope
#                             (huggingface.co/settings/tokens). REQUIRED.
#   - Variable HF_USERNAME  : Hugging Face username that owns the Space
#                             (optional; defaults to "Sri-28").
#   - Variable HF_SPACE     : the Space name (optional; defaults to "Docuask").
#
# Until HF_TOKEN is set the job no-ops, so this workflow never fails the branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check for HF token
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN found (length ${#HF_TOKEN})."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Manually triggered → the user wants to deploy, so fail loudly
            # instead of a misleading green "success".
            echo "::error title=HF_TOKEN missing::No secret named HF_TOKEN is visible to this workflow. Add it under Settings → Secrets and variables → Actions → the 'Secrets' tab (NOT 'Variables'), named exactly HF_TOKEN, value = a Hugging Face token with the *Write* role."
            exit 1
          else
            echo "HF_TOKEN not set — skipping sync (automatic push)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (full history)
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        if: steps.check.outputs.ok == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME || 'Sri-28' }}
          HF_SPACE: ${{ vars.HF_SPACE || 'Docuask' }}
        run: |
          echo "Syncing to https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git" \
            HEAD:main
