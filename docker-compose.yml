services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Keep the telemetry DB on a mounted volume so interactions survive
      # container restarts.
      DOCUASK_DB: /data/docuask.db
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:
